<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" role="img" aria-labelledby="dwTitle dwDesc">
  <title id="dwTitle">Daily Wrap</title>
  <desc id="dwDesc">A rolled newspaper wrap with sports data peeking out of the top and a blue D seal at the fold.</desc>

  <defs>
    <!-- Wrap silhouette: tall, tapered, tucked base. Everything folds inside this. -->
    <clipPath id="dwPaper" clipPathUnits="userSpaceOnUse">
      <path d="M-58,-104 Q0,-96 58,-104
               C60,-40 56,20 46,66
               C42,90 38,112 14,117
               C4,119 -4,119 -14,117
               C-38,112 -42,90 -46,66
               C-56,20 -60,-40 -58,-104 Z"/>
    </clipPath>
    <!-- Keeps the filling's shading inside the dome -->
    <clipPath id="dwFill" clipPathUnits="userSpaceOnUse">
      <path d="M-58,-104 A58,38 0 0 1 58,-104 Z"/>
    </clipPath>
  </defs>

  <!-- App tile -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="#0f172a"/>
  <rect x="34" y="34" width="444" height="444" rx="94" fill="none" stroke="#334155" stroke-width="4"/>

  <!-- Artwork: bbox re-centred on (256,256), tilted, scaled to the 360x360 safe box -->
  <g transform="translate(256,256) rotate(-10) scale(1.28) translate(0,11.5)">

    <!-- ===== 1. FILLING — scores/data peeking out ===== -->
    <path d="M-58,-104 A58,38 0 0 1 58,-104 Z" fill="#38bdf8"/>
    <g clip-path="url(#dwFill)">
      <rect x="-60" y="-116" width="120" height="14" fill="#2563eb"/>
    </g>
    <circle cx="-24" cy="-118" r="12" fill="#ef4444"/>
    <circle cx="19" cy="-114" r="9" fill="#f59e0b"/>

    <!-- ===== 2. BACK SHEET ===== -->
    <path d="M-58,-104 Q0,-96 58,-104
             C60,-40 56,20 46,66
             C42,90 38,112 14,117
             C4,119 -4,119 -14,117
             C-38,112 -42,90 -46,66
             C-56,20 -60,-40 -58,-104 Z"
          fill="#cbd5e1"/>

    <!-- Cut paper edge at the opening -->
    <path d="M-58,-104 Q0,-96 58,-104 L58,-95 Q0,-87 -58,-95 Z" fill="#94a3b8"/>

    <!-- Headline + column rules, bowed to follow the roll -->
    <g fill="none" stroke-linecap="round">
      <path d="M-44,-80 Q0,-72 44,-80" stroke="#1e293b" stroke-width="12"/>
      <path d="M-42,-62 Q-24,-57 -6,-59" stroke="#64748b" stroke-width="6.5"/>
      <path d="M4,-59 Q24,-61 42,-66" stroke="#64748b" stroke-width="6.5"/>
      <path d="M-40,-47 Q-26,-43 -12,-45" stroke="#94a3b8" stroke-width="5.5"/>
      <path d="M-3,-45 Q19,-47 39,-52" stroke="#94a3b8" stroke-width="5.5"/>
    </g>

    <!-- ===== 3. THE FOLDS — clipped to the paper so nothing spikes out ===== -->
    <g clip-path="url(#dwPaper)">

      <!-- Left flap (tucked under) -->
      <path d="M-70,-34 L48,126 L-70,126 Z" fill="#f1f5f9"/>

      <!-- Right flap (the overlap that seals the wrap) -->
      <path d="M70,-34 L-48,126 L70,126 Z" fill="#ffffff"/>

      <!-- Article column running along the front fold -->
      <g transform="translate(39,31) rotate(-54)">
        <rect x="-11" y="-14" width="24" height="6.5" rx="3" fill="#0f172a"/>
        <rect x="-11" y="-3" width="18" height="4.5" rx="2.2" fill="#64748b"/>
        <rect x="-11" y="5" width="22" height="4.5" rx="2.2" fill="#64748b"/>
      </g>

      <!-- Creases -->
      <path d="M-70,-34 L0,61" fill="none" stroke="#cbd5e1" stroke-width="2.5"/>
      <path d="M70,-34 L0,61" fill="none" stroke="#cbd5e1" stroke-width="2.5"/>
      <path d="M-30,104 Q0,92 30,104" fill="none" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Silhouette edge -->
    <path d="M-58,-104 Q0,-96 58,-104
             C60,-40 56,20 46,66
             C42,90 38,112 14,117
             C4,119 -4,119 -14,117
             C-38,112 -42,90 -46,66
             C-56,20 -60,-40 -58,-104 Z"
          fill="none" stroke="#94a3b8" stroke-width="2"/>

    <!-- ===== 4. THE "D" SEAL ===== -->
    <circle cx="0" cy="62" r="26" fill="#2563eb" stroke="#f8fafc" stroke-width="5"/>
    <g transform="translate(0,62) rotate(10)">
      <path fill-rule="evenodd" fill="#ffffff"
            d="M-11,-13 H-2 A13,13 0 0 1 -2,13 H-11 Z
               M-4.5,-6.5 H-2 A6.5,6.5 0 0 1 -2,6.5 H-4.5 Z"/>
    </g>
  </g>
</svg>