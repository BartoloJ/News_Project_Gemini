name: Update headlines

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-headlines
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/fetch-headlines.js
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add headlines.json data/headlines.json 2>/dev/null || git add headlines.json
          if git diff --cached --quiet; then
            echo "No changes to headlines"
          else
            git commit -m "Update headlines [last checked: $(date -u +'%Y-%m-%dT%H:%M:%SZ')]"
            git pull --rebase origin ${GITHUB_REF_NAME:-main} || true
            git push
          fi
